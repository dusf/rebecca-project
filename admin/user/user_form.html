<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>

      <header class="um-form-header" id="userFormHeader"></header>

    </section>
  </main>
  <div class="um-toast-region" id="userFormToastRegion" aria-live="polite" aria-atomic="true"></div>

  <script>var CURRENT_PAGE = 'users';</script>
  <script src="../common/js/commons.js?v=8"></script>
  <script src="js/user_store.js?v=6"></script>
