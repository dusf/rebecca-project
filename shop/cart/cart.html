<main class="cart-page">
  <!-- 面包屑导航 -->
  <div class="shop-container">
    <nav class="cart-breadcrumb" id="cartBreadcrumb">
      <a href="#" class="cart-bc-link" id="cartBcHome">首页</a>
      <span class="cart-bc-sep">/</span>
      <span class="cart-bc-current">购物车</span>
    </nav>
  </div>

  <!-- 主内容区 -->
  <div class="shop-container cart-container" id="cartContainer">
    <!-- 购物车列表 -->
    <div class="cart-main">
      <!-- 全选栏 -->
      <div class="cart-list-toolbar">
        <div class="cart-toolbar-left">
          <label class="cart-check-wrap">
            <input type="checkbox" id="cartSelectAll" checked>
            <span class="cart-checkbox"></span>
            <span>全选</span>
          </label>
          <span class="cart-selected-info">已选 <strong id="cartSelectedCountTop">0</strong> 件</span>
        </div>
        <div class="cart-toolbar-right">
          <button class="cart-delete-selected-btn" id="cartDeleteSelectedTop">删除选中</button>
        </div>
      </div>

      <!-- 商品列表 -->
      <div class="cart-list" id="cartList"></div>

      <!-- 底部操作栏 -->
      <div class="cart-bottom-bar">
        <div class="cart-bottom-left">
          <label class="cart-check-wrap">
            <input type="checkbox" id="cartSelectAllBottom" checked>
            <span class="cart-checkbox"></span>
            <span>全选</span>
          </label>
          <span class="cart-selected-info">已选 <strong id="cartSelectedCount">0</strong> 件</span>
        </div>
        <div class="cart-bottom-right">
          <button class="cart-delete-selected-btn" id="cartDeleteSelected">删除选中</button>
        </div>
      </div>
    </div>

    <!-- 右侧订单摘要 -->
    <aside class="cart-sidebar">
      <div class="cart-order-card">
        <h3 class="cart-order-title">订单摘要</h3>
        <div class="cart-order-rows">
          <div class="cart-order-row">
            <span>商品数量</span>
            <span id="orderItemCount">0 件</span>
          </div>
          <div class="cart-order-row">
            <span>商品金额</span>
            <span id="orderSubtotal">$0.00</span>
          </div>
          <div class="cart-order-row">
            <span>商品折扣</span>
            <span class="cart-discount" id="orderDiscount">-$0.00</span>
          </div>
          <div class="cart-order-row">
            <span>预计运费</span>
            <span id="orderShipping">结算页计算</span>
          </div>
          <div class="cart-order-row">
            <span>预计税费</span>
            <span id="orderTax">结算页计算</span>
          </div>
        </div>
        <div class="cart-order-total">
          <span>小计总额</span>
          <span id="orderGrandTotal">$0.00</span>
        </div>
        <button class="cart-checkout-btn cart-checkout-btn-full" id="cartSidebarCheckout">去结算</button>
        <div class="cart-trust-badges">
          <div class="cart-trust-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>安全支付</span>
          </div>
          <div class="cart-trust-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>全球配送</span>
          </div>
          <div class="cart-trust-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>30天退换</span>
          </div>
        </div>
        <div class="cart-pay-block">
          <div class="cart-pay-title">支持以下支付方式</div>
          <div class="cart-pay-icons">
            <span class="cart-pay-ico" title="Klarna" aria-label="Klarna"><img src="https://cdn.simpleicons.org/klarna" alt="Klarna"></span>
            <span class="cart-pay-ico" title="PayPal" aria-label="PayPal"><img src="https://cdn.simpleicons.org/paypal" alt="PayPal"></span>
            <span class="cart-pay-ico" title="Afterpay" aria-label="Afterpay"><img src="https://cdn.simpleicons.org/afterpay" alt="Afterpay"></span>
            <span class="cart-pay-ico" title="Visa" aria-label="Visa"><img src="https://cdn.simpleicons.org/visa" alt="Visa"></span>
            <span class="cart-pay-ico" title="Mastercard" aria-label="Mastercard"><img src="https://cdn.simpleicons.org/mastercard" alt="Mastercard"></span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 猜你喜欢 -->
  <section class="cart-recommend">
    <div class="shop-container">
      <h2 class="cart-rec-title">猜你喜欢</h2>
      <div class="cart-rec-grid" id="cartRecGrid"></div>
    </div>
  </section>

  <!-- 空购物车 -->
  <div class="cart-empty" id="cartEmpty" style="display:none;">
    <div class="cart-empty-icon">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="26" cy="24" r="20"/><path d="M6 58h44"/><path d="M12 58V38"/><path d="M44 58V38"/><path d="M14 22h24"/><path d="M26 14v20"/></svg>
    </div>
    <h2 class="cart-empty-title">您的购物车是空的</h2>
    <p class="cart-empty-desc">快去挑选心仪的商品吧</p>
    <a href="#" class="cart-empty-btn" id="cartGoShopping">去逛逛</a>
  </div>
</main>
