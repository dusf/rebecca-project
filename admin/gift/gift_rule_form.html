<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赠品规则 - 编辑</title>
  <link rel="stylesheet" href="/admin/common/css/commons.css">
  <link rel="stylesheet" href="css/gift.css">
</head>
<body>
  <div class="admin-page">
    <div class="page-container">
      <div class="gwp-form-page">
      <div class="page-header">
        <div class="page-title" id="formTitle">创建赠品规则</div>
        <div class="page-actions">
          <button class="btn btn-secondary" id="btnCancel">返回</button>
          <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
      </div>

      <div class="gwp-layout">
        <div class="gwp-main">
          <!-- 基本信息 -->
          <div class="gwp-form-card">
            <div class="gwp-section-head">
              <div class="gwp-section">基本信息</div>
              <div class="gwp-section-desc">设置用于识别和管理的规则名称</div>
            </div>
            <div class="gwp-form">
              <div class="form-group full">
                <label class="form-label">规则名称 <span class="req">*</span></label>
                <input type="text" class="form-input" id="ruleName" placeholder="如：满 300 元送化妆镜" maxlength="60">
              </div>
            </div>
          </div>

          <!-- 赠送范围 -->
          <div class="gwp-form-card">
            <div class="gwp-section-head">
              <div class="gwp-section">赠送范围</div>
              <div class="gwp-section-desc">指定规则适用的产品系列或具体产品</div>
            </div>
            <div class="gwp-form">
              <div class="form-group full">
                <label class="form-label">适用范围</label>
                <div class="gwp-combo" id="scopeMode" data-kind="enum" data-arg="collection:产品系列|product:产品" data-value="collection" data-default="collection" data-placeholder="选择适用范围"></div>
              </div>
              <div class="form-group full" id="scopePickerGroup">
                <div class="gwp-scope-trigger">
                  <button type="button" class="gwp-scope-btn" id="scopePickerBtn">选择产品系列 <span id="scopeSelectedCount"></span></button>
                  <div class="gwp-scope-selected-list" id="scopeSelectedList"></div>
                </div>
                <div class="gwp-helper-text" id="scopeHelper">可选择多个产品系列，命中任一系列即可参与赠送。</div>
              </div>
            </div>
          </div>

          <!-- 赠送条件 -->
          <div class="gwp-form-card">
            <div class="gwp-section-head gwp-condition-section-head">
              <div>
                <div class="gwp-section">赠送条件</div>
                <div class="gwp-section-desc" id="conditionCombineDesc">满足以下任一条件即可，多个条件之间为“或”关系</div>
              </div>
              <div class="gwp-seg gwp-condition-mode" id="conditionCombineSeg">
                <button type="button" class="active" data-combine="or">满足任意</button>
                <button type="button" data-combine="and">满足全部</button>
              </div>
            </div>
            <div id="condList"></div>
            <button class="btn btn-secondary gwp-add-condition" id="addCond">＋ 添加条件</button>
          </div>

          <!-- 赠品设置 -->
          <div class="gwp-form-card">
            <div class="gwp-section-head gwp-reward-section-head">
              <div>
                <div class="gwp-section">赠品设置</div>
                <div class="gwp-section-desc">当多个赠品规则同时命中时，允许买家在购物车或结算页任选 1 个规则的赠品</div>
              </div>
              <button class="btn btn-secondary" id="pickGift">添加赠品</button>
            </div>
            <div id="giftReward">
              <div id="giftList" class="gwp-gift-list"></div>
            </div>
          </div>
        </div>
        <aside class="gwp-sidebar">
          <div class="gwp-side-card">
            <div class="gwp-side-title">状态</div>
            <div class="gwp-combo" id="status" data-kind="enum" data-arg="active:启用|disabled:禁用|draft:草稿" data-value="active" data-default="active" data-placeholder="请选择状态"></div>
          </div>
        </aside>
      </div>
      </div>
    </div>
  </div>

  <script src="js/gift_common.js"></script>
  <script src="js/gift_rule_form.js"></script>
</body>
</html>
