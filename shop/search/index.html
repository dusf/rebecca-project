<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIRÉ HAIR — 搜索结果</title>
  <link rel="stylesheet" href="css/search-results.css">
</head>
<body>
  <section class="search-results-page">
    <div class="page-container">
      <!-- 标题区 -->
      <div class="page-header">
        <h1 class="page-title">搜索结果</h1>
      </div>

      <!-- 搜索框 -->
      <div class="search-box-wrap">
        <div class="search-box">
          <input type="text" id="srKeyword" placeholder="搜索假发、接发、配件...">
          <button type="button" id="srSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>

      <p class="result-count" id="srCount">找到 0 件相关商品</p>

      <!-- 相关搜索 -->
      <div class="related-search" id="srRelatedWrap">
        <span class="label">相关搜索</span>
        <div class="tags" id="srRelated"></div>
      </div>

      <!-- 搜索范围 -->
      <div class="scope-tabs" id="srScopeTabs">
        <span class="label">搜索范围：</span>
        <button class="tab active" data-scope="all">全部</button>
        <button class="tab" data-scope="wig">假发</button>
        <button class="tab" data-scope="extension">接发</button>
        <button class="tab" data-scope="accessory">配件</button>
      </div>

      <!-- 主体：左筛选 + 右结果 -->
      <div class="search-layout">
        <!-- 左侧筛选 -->
        <aside class="search-filters" id="srFilters">
          <div class="filter-block">
            <div class="filter-title">
              <span>假发类型</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <label><input type="checkbox" data-filter="type" value="hd"><span>HD蕾丝假发</span></label>
              <label><input type="checkbox" data-filter="type" value="glueless"><span>无胶假发</span></label>
              <label><input type="checkbox" data-filter="type" value="closure"><span>Closure假发</span></label>
              <label><input type="checkbox" data-filter="type" value="frontal"><span>蕾丝前额头套</span></label>
              <label><input type="checkbox" data-filter="type" value="full-lace"><span>全蕾丝假发</span></label>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>发型纹理</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <label><input type="checkbox" data-filter="texture" value="straight"><span>直发</span></label>
              <label><input type="checkbox" data-filter="texture" value="deep-wave"><span>深波浪</span></label>
              <label><input type="checkbox" data-filter="texture" value="body-wave"><span>大波浪</span></label>
              <label><input type="checkbox" data-filter="texture" value="loose-wave"><span>松散波浪</span></label>
              <label><input type="checkbox" data-filter="texture" value="water-wave"><span>水波纹</span></label>
              <label><input type="checkbox" data-filter="texture" value="natural-curl"><span>自然卷</span></label>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>长度</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <label><input type="checkbox" data-filter="length" value="8-12"><span>8-12英寸</span></label>
              <label><input type="checkbox" data-filter="length" value="14-18"><span>14-18英寸</span></label>
              <label><input type="checkbox" data-filter="length" value="20-24"><span>20-24英寸</span></label>
              <label><input type="checkbox" data-filter="length" value="32"><span>32英寸以上</span></label>
              <label><input type="checkbox" data-filter="length" value="35"><span>35英寸以上</span></label>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>颜色</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content color-grid">
              <label class="color-option" data-color="natural-black"><span class="dot" style="background:#1a1a1a"></span><span>自然黑</span></label>
              <label class="color-option" data-color="dark-brown"><span class="dot" style="background:#3d2314"></span><span>深棕色</span></label>
              <label class="color-option" data-color="chocolate"><span class="dot" style="background:#5c3a21"></span><span>巧克力棕</span></label>
              <label class="color-option" data-color="honey"><span class="dot" style="background:#b87333"></span><span>蜂蜜棕</span></label>
              <label class="color-option" data-color="golden"><span class="dot" style="background:#c8a25f"></span><span>金色</span></label>
              <label class="color-option" data-color="ombre"><span class="dot" style="background:linear-gradient(135deg,#1a1a1a,#c8a25f)"></span><span>挑染色</span></label>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>工艺</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <label><input type="checkbox" data-filter="craft" value="pre-plucked"><span>预拔发际线</span></label>
              <label><input type="checkbox" data-filter="craft" value="hd-lace"><span>HD蕾丝</span></label>
              <label><input type="checkbox" data-filter="craft" value="handmade"><span>手工钩织</span></label>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>价格</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <div class="price-slider">
                <input type="range" id="srPriceMin" min="0" max="6999" value="0">
                <input type="range" id="srPriceMax" min="0" max="6999" value="6999">
                <div class="price-track"></div>
              </div>
              <div class="price-labels">
                <span id="srPriceMinLabel">¥0</span>
                <span id="srPriceMaxLabel">¥6,999+</span>
              </div>
            </div>
          </div>

          <div class="filter-block">
            <div class="filter-title">
              <span>其他</span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="filter-content">
              <label><input type="checkbox" data-filter="other" value="in-stock"><span>仅看有货</span></label>
            </div>
          </div>

          <button type="button" class="clear-filters" id="srClearAll">↺ 清除全部筛选</button>
        </aside>

        <!-- 右侧结果 -->
        <div class="search-main">
          <div class="main-header">
            <div class="sort-bar">
              <span>排序：</span>
              <button class="sort-btn active" data-sort="recommend">综合推荐</button>
              <button class="sort-btn" data-sort="new">新品优先</button>
              <button class="sort-btn" data-sort="sales">销量优先</button>
              <button class="sort-btn" data-sort="price-asc">价格从低到高</button>
            </div>
          </div>

          <div class="active-filters" id="srActiveFilters">
            <span class="label">已选条件：</span>
            <div class="filter-tags" id="srFilterTags"></div>
            <button class="clear-tags" id="srClearTags">清除全部</button>
          </div>

          <div class="product-grid" id="srGrid"></div>

          <div class="pagination" id="srPagination"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/search-results.js"></script>
</body>
</html>
