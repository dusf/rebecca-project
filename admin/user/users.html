<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="../common/css/commons.css">
  <link rel="stylesheet" href="css/users.css?v=9">
</head>
<body>
  <main class="um-page um-list-page" id="userListPage">
    <section class="um-page-container">
      <header class="um-page-header" id="userListHeader">
        <div>
          <h1 class="page-title">用户管理<span class="um-title-count" id="userTotalCount">(0位)</span></h1>
          <p class="um-page-subtitle">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span>集中管理当前店铺的买家账号、邮件订阅者及从外部店铺导入的用户档案</span>
            <button class="um-guidance-trigger" type="button" id="userGuidanceTrigger" aria-controls="userListGuidance" aria-expanded="true">查看用户规则</button>
          </p>
        </div>
        <div class="um-header-actions">
          <button class="um-button um-button-secondary" type="button" id="userExportButton">导出用户</button>
          <details class="um-menu" id="userImportMenu">
            <summary class="um-button um-button-secondary">导入用户</summary>
            <div class="um-menu-panel um-menu-panel-right">
              <button type="button" data-import="shopify">从 Shopify 导入</button>
              <button type="button" data-import="csv">从 CSV 导入</button>
            </div>
          </details>
          <button class="um-button um-button-primary" type="button" id="userAddButton">添加用户</button>
        </div>
      </header>
      <div class="um-guidance um-guidance-important um-dismissible-guidance" id="userListGuidance" role="note" tabindex="-1">
        <span>同一邮箱只保留一条用户档案。邮件订阅与账号注册相互独立；仅订阅用户后续注册或快捷登录时会激活原档案。</span>
        <div class="um-guidance-actions">
          <button class="um-guidance-never-show" type="button" data-guidance-action="never-show">不再展示</button>
          <button class="um-guidance-close" type="button" data-guidance-action="close" aria-label="关闭用户规则提示" title="关闭">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>
      <nav class="um-view-tabs" id="userViewTabs" aria-label="用户快捷视图"></nav>
      <section class="um-toolbar" id="userToolbar" aria-label="用户筛选">
        <div class="um-toolbar-search">
          <label class="um-visually-hidden" for="userSearchInput">搜索用户</label>
          <input class="um-text-control um-search-input" type="search" id="userSearchInput" placeholder="搜索编号、姓名、邮箱、手机号或标签">
        </div>
        <div class="um-filter-grid">
          <div id="userAccountFilter"></div>
          <div id="userMarketingFilter"></div>
          <div id="userSourceFilter"></div>
          <div id="userProviderFilter"></div>
          <div id="userStoreFilter"></div>
          <div class="um-date-filter">
            <div id="userCreatedFrom"></div>
          </div>
          <span class="um-date-filter-separator" aria-hidden="true">至</span>
          <div class="um-date-filter">
            <div id="userCreatedTo"></div>
          </div>
          <button class="um-button um-button-ghost" type="button" id="userClearFilters">清除筛选</button>
        </div>
      </section>
      <section class="um-bulk-bar" id="userBulkBar" aria-live="polite">
        <div class="um-bulk-selected-count">已选 <span class="um-bulk-count" id="userSelectedCount">0</span> 条</div>
        <div class="um-bulk-actions">
          <div class="um-bulk-selection-actions" id="userBulkSelectionActions"></div>
          <details class="um-menu" id="userColumnMenu">
            <summary class="um-button um-button-secondary um-button-sm">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
              自定义列
            </summary>
            <div class="um-column-panel um-menu-panel-right" id="userColumnPanel"></div>
          </details>
          <button class="um-icon-button um-button-sm" type="button" id="userRefreshButton" aria-label="按当前筛选条件刷新用户列表" title="按当前筛选条件刷新用户列表">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
        </div>
      </section>
      <section class="um-table-card" id="userTableCard" aria-busy="false">
        <span class="um-visually-hidden" id="userResultSummary" aria-live="polite">0 个结果</span>
        <div class="um-table-scroll" id="userTableScroll">
          <table class="um-table" aria-label="用户列表">
            <thead id="userTableHead"></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
        <div class="um-table-state" id="userTableState" hidden></div>
        <footer class="um-pagination" id="userPagination"></footer>
      </section>
    </section>
    <div class="um-toast-region" id="userToastRegion" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script>var CURRENT_PAGE = 'users';</script>
  <script src="../common/js/commons.js"></script>
  <script src="js/user_store.js"></script>
  <script src="js/user_components.js"></script>
  <script src="js/users.js?v=8"></script>
</body>
</html>
